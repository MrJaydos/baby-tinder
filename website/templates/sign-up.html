{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="auth-card">
      <div class="text-center mb-4">
        <div style="font-size:3rem;">&#128149;</div>
        <h3>Create your account</h3>
      </div>
      <form method="POST">
        <div class="form-group">
          <label style="font-weight:700;color:var(--plum);">Email Address</label>
          <input type="email" class="form-control" name="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label style="font-weight:700;color:var(--plum);">First Name</label>
          <input type="text" class="form-control" name="firstName" placeholder="Your first name" required />
        </div>
        <div class="form-group">
          <label style="font-weight:700;color:var(--plum);">Password</label>
          <input type="password" class="form-control" name="password1" placeholder="At least 7 characters" required />
        </div>
        <div class="form-group">
          <label style="font-weight:700;color:var(--plum);">Confirm Password</label>
          <input type="password" class="form-control" name="password2" placeholder="Repeat your password" required />
        </div>
        <button type="submit" class="btn-pink btn btn-block mt-3" style="font-size:1rem;">Create Account</button>
      </form>
      <p class="text-center mt-4 mb-0" style="color:var(--muted);font-weight:600;">
        Already have an account? <a href="/login">Login</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
